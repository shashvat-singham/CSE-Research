# The chart palette in theme.py is validated against the light surface
# #fcfcfb. Pinning the theme keeps the rendered colours the ones that were
# actually checked for colour-vision-deficiency separation and contrast.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
font = "sans serif"

[server]
maxUploadSize = 10
enableXsrfProtection = true

[browser]
gatherUsageStats = false
